[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:fifth-bg fg:fifth-fg"
format = '[  $time ]($style)'

[cmd_duration]
disabled = false
min_time = 1_000
show_milliseconds = true
style = "bg:fifth-bg fg:fifth-fg"
format = '[ 󱦟 $duration ]($style)'

