[directory]
style = "fg:second-fg bg:second-bg"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo=false
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""

[git_branch]
symbol = ""
style = "bg:third-bg fg:third-fg"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:third-bg fg:third-fg"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "bg:fourth-bg fg:fourth-fg"
format = '[ $symbol ($version) ]($style)'

[rust]
